---
- name: Validate node variables
  ansible.builtin.assert:
    that:
      - qdrant_node_id | int >= 1
      - qdrant_image is match('^qdrant/qdrant:v[0-9]+[.][0-9]+[.][0-9]+$')
      - qdrant_metrics_proxy_image is match('^nginx:[0-9]+[.][0-9]+(-alpine)?$')
    fail_msg: "Pin qdrant_image and qdrant_metrics_proxy_image to exact versions."

- name: Check the secrets file exists
  ansible.builtin.stat:
    path: "{{ qdrant_env_file }}"
  register: qdrant_env_file_stat

- name: Require the secrets file
  ansible.builtin.assert:
    that:
      - qdrant_env_file_stat.stat.exists
    fail_msg: "{{ qdrant_env_file }} is missing. Run playbooks/bootstrap.yml first."

- name: Create compose directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: qdrant
    group: qdrant
    mode: "0755"
  loop:
    - "{{ qdrant_compose_dir }}"
    - "{{ qdrant_metrics_proxy_dir }}"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qdrant_compose_dir }}/docker-compose.yml"
    owner: qdrant
    group: qdrant
    mode: "0644"
  register: qdrant_compose_file

- name: Render metrics proxy nginx template
  ansible.builtin.template:
    src: metrics-proxy.conf.template.j2
    dest: "{{ qdrant_metrics_proxy_dir }}/nginx.conf.template"
    owner: qdrant
    group: qdrant
    mode: "0644"
  register: qdrant_metrics_proxy_file

- name: Start or update the Qdrant stack
  community.docker.docker_compose_v2:
    project_src: "{{ qdrant_compose_dir }}"
    env_files:
      - "{{ qdrant_env_file }}"
    state: present
    pull: missing
    remove_orphans: true
  when: not ansible_check_mode

- name: Wait for Qdrant readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qdrant_http_port }}/readyz"
    status_code: 200
  register: qdrant_ready
  retries: 60
  delay: 5
  until: qdrant_ready.status == 200
  when: not ansible_check_mode

- name: Wait for the metrics proxy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qdrant_metrics_port }}/metrics"
    status_code: 200
  register: qdrant_metrics_ready
  retries: 12
  delay: 5
  until: qdrant_metrics_ready.status == 200
  when: not ansible_check_mode
