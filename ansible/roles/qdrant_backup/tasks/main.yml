---
- name: Require exactly one backup coordinator
  ansible.builtin.assert:
    that:
      - groups[qdrant_backup_coordinator_group] | default([]) | length == 1
      - inventory_hostname in groups[qdrant_backup_coordinator_group]
    fail_msg: "Qdrant backups must be installed on exactly one coordinator host."

- name: Validate backup configuration
  ansible.builtin.assert:
    that:
      - qdrant_backup_retention_keep | int >= 1
      - qdrant_backup_s3_bucket | length > 0
      - qdrant_backup_s3_prefix | length > 0
      - qdrant_backup_aws_region | length > 0
      - vault_qdrant_backup_aws_access_key_id | default('') | length > 0
      - vault_qdrant_backup_aws_secret_access_key | default('') | length > 0
    fail_msg: "Backup variables or vault S3 credentials are incomplete."
  no_log: true

- name: Install OS dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - coreutils
      - openssh-client
      - python3
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check for AWS CLI
  ansible.builtin.command: /usr/local/bin/aws --version
  register: qdrant_backup_awscli_check
  changed_when: false
  failed_when: false

- name: Install AWS CLI v2
  when: qdrant_backup_awscli_check.rc != 0
  block:
    - name: Download AWS CLI installer
      ansible.builtin.get_url:
        url: "{{ qdrant_backup_awscli_url }}"
        dest: "{{ qdrant_backup_awscli_archive }}"
        owner: root
        group: root
        mode: "0644"

    - name: Reset installer directory
      ansible.builtin.file:
        path: "{{ qdrant_backup_awscli_extract_dir }}"
        state: absent

    - name: Create installer directory
      ansible.builtin.file:
        path: "{{ qdrant_backup_awscli_extract_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack installer
      ansible.builtin.unarchive:
        src: "{{ qdrant_backup_awscli_archive }}"
        dest: "{{ qdrant_backup_awscli_extract_dir }}"
        remote_src: true

    - name: Run installer
      ansible.builtin.command:
        cmd: >-
          {{ qdrant_backup_awscli_extract_dir }}/aws/install
          --bin-dir /usr/local/bin
          --install-dir /usr/local/aws-cli
          --update
        creates: /usr/local/bin/aws

- name: Create backup directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ qdrant_backup_env_dir }}", mode: "0700" }
    - { path: "{{ qdrant_backup_state_dir }}", mode: "0750" }
    - { path: "{{ qdrant_backup_lib_dir }}", mode: "0755" }
    - { path: "{{ qdrant_backup_metrics_textfile_dir }}", mode: "0755" }

- name: Install backup environment file
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ qdrant_backup_env_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true

- name: Install SSH config for reaching every node
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ qdrant_backup_ssh_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Install backup helper scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item }}"
    dest: "{{ qdrant_backup_lib_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - qdrant-backup-node.sh
    - qdrant-backup-manifest.py
    - qdrant-backup-metrics.py
    - qdrant-s3-retention-plan.py
    - qdrant-s3-object-verify.py
    - qdrant-stream-verify.py
    - qdrant-local-cleanup-report.py

- name: Install backup coordinator script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/qdrant-systemd-snapshot-backup.sh"
    dest: "{{ qdrant_backup_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - qdrant-backup.service
    - qdrant-backup.timer
    - qdrant-backup-metrics.service
    - qdrant-backup-metrics.timer
  notify: Reload systemd

- name: Flush handlers before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable the backup timer
  ansible.builtin.systemd:
    name: qdrant-backup.timer
    enabled: "{{ qdrant_backup_enabled | bool }}"
    state: "{{ qdrant_backup_enabled | bool | ternary('started', 'stopped') }}"
  when: not ansible_check_mode

- name: Enable the backup metrics timer
  ansible.builtin.systemd:
    name: qdrant-backup-metrics.timer
    enabled: "{{ qdrant_backup_metrics_enabled | bool }}"
    state: "{{ qdrant_backup_metrics_enabled | bool | ternary('started', 'stopped') }}"
  when: not ansible_check_mode
