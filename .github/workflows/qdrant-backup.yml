name: Qdrant backup (manual)

# Triggers the same systemd backup job that runs on the coordinator twice a
# day, and shows its summary. Useful before an upgrade or a risky change.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BACKUP to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qdrant-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Run snapshot backup on the coordinator
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Check confirmation
        run: |
          [[ "${{ inputs.confirmation }}" == "BACKUP" ]] || { echo "::error::type BACKUP to confirm"; exit 1; }

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Build inventory from Terraform state
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > terraform/backend.hcl
          make init >/dev/null
          make inventory

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          coordinator="$(awk '/ansible_host:/ {print $2; exit}' ansible/inventories/production/hosts.yml)"
          ssh-keyscan -T 10 -t ed25519 "$coordinator" >> ~/.ssh/known_hosts 2>/dev/null
          echo "COORDINATOR=${coordinator}" >> "$GITHUB_ENV"

      - name: make backup
        run: |
          set -euo pipefail
          make backup | tee backup.log
          { echo '### Qdrant snapshot backup'; cat backup.log; } >> "$GITHUB_STEP_SUMMARY"

      - name: Show journal on failure
        if: failure()
        run: ssh -o BatchMode=yes "root@${COORDINATOR}" 'journalctl -u qdrant-backup.service --no-pager -n 200' || true

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_ed25519 terraform/backend.hcl terraform/backend_override.tf
