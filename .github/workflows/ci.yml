name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: ./scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and linters
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.20" "ansible-lint>=24,<26" "yamllint>=1.35"
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

      - name: YAML lint
        run: yamllint -c .yamllint ansible/ terraform/ .github/

      - name: Ansible lint
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
        run: ansible-lint --offline

      - name: Ansible syntax check
        working-directory: ansible
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
        run: |
          cp inventories/hosts.yml.example inventories/production/hosts.yml
          cp inventories/production/group_vars/all/vault.yml.example inventories/production/group_vars/all/vault.yml
          for playbook in site bootstrap qdrant monitoring backup-timer audit; do
            ansible-playbook -i inventories/production "playbooks/${playbook}.yml" --syntax-check
          done

      - name: Python tests
        run: |
          for test in tests/*-test.py; do
            echo "== ${test}"
            python "$test"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.58.1

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --minimum-failure-severity=warning

      - name: Terraform security scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL

  plan:
    name: Terraform plan
    # Only when the repository has real credentials configured (a fork without
    # secrets still gets the lint job above).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure remote state
        working-directory: terraform
        run: |
          cp backend_override.tf.example backend_override.tf
          printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > backend.hcl

      - name: Plan
        working-directory: terraform
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -lock-timeout=120s -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(0, 60000);
            const body = `${marker}\n## Terraform plan\n\n<details><summary>plan output</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
