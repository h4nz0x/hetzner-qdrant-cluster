name: Terraform apply

# Creates or updates the Hetzner infrastructure. Protected by the
# `production` environment (add required reviewers there) and an explicit
# confirmation string so nobody applies by accident.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
      confirmation:
        description: "Type APPLY to apply, or DESTROY to destroy (leave empty for plan)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}

jobs:
  terraform:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check confirmation
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan) ;;
            apply)   [[ "$CONFIRMATION" == "APPLY" ]]   || { echo "::error::type APPLY to confirm"; exit 1; } ;;
            destroy) [[ "$CONFIRMATION" == "DESTROY" ]] || { echo "::error::type DESTROY to confirm"; exit 1; } ;;
          esac

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure remote state
        working-directory: terraform
        run: |
          set -euo pipefail
          test -n "$HCLOUD_TOKEN" || { echo "::error::HCLOUD_TOKEN secret is missing"; exit 1; }
          cp backend_override.tf.example backend_override.tf
          printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > backend.hcl
          test -f terraform.tfvars || { echo "::error::terraform/terraform.tfvars is not committed"; exit 1; }
          terraform init -input=false -backend-config=backend.hcl

      - name: Plan
        working-directory: terraform
        run: |
          set -euo pipefail
          extra=()
          [[ "${{ inputs.action }}" == "destroy" ]] && extra=(-destroy)
          terraform plan -input=false -lock-timeout=120s -no-color -out=tfplan "${extra[@]}" | tee plan.txt
          {
            echo '### Terraform plan (${{ inputs.action }})'
            echo '```hcl'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.action != 'plan'
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=120s -no-color tfplan

      - name: Show outputs
        if: inputs.action == 'apply'
        working-directory: terraform
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform output -no-color
            echo '```'
            echo
            echo "Next: run the **Ansible deploy** workflow with playbook \`site\`."
          } >> "$GITHUB_STEP_SUMMARY"
