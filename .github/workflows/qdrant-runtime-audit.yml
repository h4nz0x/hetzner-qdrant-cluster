name: Production Qdrant Runtime Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type READ_ONLY_QDRANT_RUNTIME_AUDIT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mongodb-infra-workflows
  cancel-in-progress: false

jobs:
  validate:
    name: 1. Validate read-only Qdrant runtime audit
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, mongodb-infra]
    steps:
      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "READ_ONLY_QDRANT_RUNTIME_AUDIT" ]]; then
            echo "::error::confirmation must be exactly READ_ONLY_QDRANT_RUNTIME_AUDIT"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          missing=0
          for command in python3 shellcheck ssh ssh-keygen ssh-keyscan timeout; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "::error::$command is required on the self-hosted runner"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Validate runtime-audit safeguards
        run: |
          set -euo pipefail
          python3 tests/qdrant-design-test.py
          python3 tests/qdrant-live-audit-test.py
          python3 tests/qdrant-runtime-audit-test.py
          shellcheck --severity=warning scripts/qdrant-runtime-read.sh

  audit:
    name: 2. Read-only Qdrant runtime report
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, mongodb-infra]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Qdrant SSH configuration
        env:
          QDRANT_SSH_PRIVATE_KEY: ${{ secrets.QDRANT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$QDRANT_SSH_PRIVATE_KEY" || {
            echo "::error::QDRANT_SSH_PRIVATE_KEY is not configured"
            exit 1
          }

          ssh_dir="${RUNNER_TEMP}/production-qdrant-runtime-ssh"
          key_file="${ssh_dir}/qdrant_runtime"
          known_hosts_file="${ssh_dir}/known_hosts"
          config_file="${ssh_dir}/config"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$QDRANT_SSH_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          install -m 0600 /dev/null "$known_hosts_file"

          cat > "$config_file" <<EOF
          Host qdrant-node-1
            HostName 203.0.113.11
            User root
            IdentityFile ${key_file}
            IdentitiesOnly yes
            UserKnownHostsFile ${known_hosts_file}
            StrictHostKeyChecking yes
            ControlMaster no
            ControlPath none
            ServerAliveInterval 15
            ServerAliveCountMax 3

          Host qdrant-node-2
            HostName 203.0.113.12
            User root
            IdentityFile ${key_file}
            IdentitiesOnly yes
            UserKnownHostsFile ${known_hosts_file}
            StrictHostKeyChecking yes
            ControlMaster no
            ControlPath none
            ServerAliveInterval 15
            ServerAliveCountMax 3

          Host qdrant-node-3
            HostName 203.0.113.13
            User root
            IdentityFile ${key_file}
            IdentitiesOnly yes
            UserKnownHostsFile ${known_hosts_file}
            StrictHostKeyChecking yes
            ControlMaster no
            ControlPath none
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 0600 "$config_file"

          ssh-keyscan -T 10 -t ed25519 \
            203.0.113.11 203.0.113.12 203.0.113.13 \
            2>/dev/null >> "$known_hosts_file"
          for host in 203.0.113.11 203.0.113.12 203.0.113.13; do
            ssh-keygen -F "$host" -f "$known_hosts_file" >/dev/null || {
              echo "::error::Could not obtain SSH host key for ${host}"
              exit 1
            }
          done
          echo "QDRANT_RUNTIME_SSH_CONFIG=${config_file}" >> "$GITHUB_ENV"

      - name: Read Qdrant runtime evidence
        run: |
          set -euo pipefail
          raw_dir="${RUNNER_TEMP}/production-qdrant-runtime-raw"
          install -d -m 0700 "$raw_dir"

          for node in qdrant-node-1 qdrant-node-2 qdrant-node-3; do
            timeout 90 ssh \
              -F "$QDRANT_RUNTIME_SSH_CONFIG" \
              "$node" \
              "/usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash -s -- ${node}" \
              < scripts/qdrant-runtime-read.sh \
              > "${raw_dir}/${node}.json"
          done

      - name: Validate and publish runtime report
        run: |
          set -euo pipefail
          raw_dir="${RUNNER_TEMP}/production-qdrant-runtime-raw"
          report_dir="${RUNNER_TEMP}/production-qdrant-runtime-report"
          install -d -m 0700 "$report_dir"

          python3 scripts/qdrant-runtime-report.py \
            --node-json "${raw_dir}/qdrant-node-1.json" \
            --node-json "${raw_dir}/qdrant-node-2.json" \
            --node-json "${raw_dir}/qdrant-node-3.json" \
            --output-json "${report_dir}/qdrant-runtime-report.json" \
            --output-md "${report_dir}/qdrant-runtime-summary.md"

          cat "${report_dir}/qdrant-runtime-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Qdrant runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-qdrant-runtime-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-qdrant-runtime-report/qdrant-runtime-report.json
            ${{ runner.temp }}/production-qdrant-runtime-report/qdrant-runtime-summary.md
          retention-days: 14

      - name: Remove temporary runtime audit material
        if: always()
        run: |
          rm -rf \
            "${RUNNER_TEMP}/production-qdrant-runtime-ssh" \
            "${RUNNER_TEMP}/production-qdrant-runtime-raw" \
            "${RUNNER_TEMP}/production-qdrant-runtime-report"
