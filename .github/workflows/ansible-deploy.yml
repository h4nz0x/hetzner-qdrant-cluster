name: Ansible deploy

# Configures the servers Terraform created. The inventory is rebuilt from
# Terraform state, so this workflow always targets the real servers.

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook to run"
        type: choice
        required: true
        default: site
        options: [site, bootstrap, qdrant, monitoring, backup-timer, audit]
      check_mode:
        description: "Dry run (--check --diff): show what would change without changing it"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ansible-production
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  ANSIBLE_NOCOLOR: "1"
  ANSIBLE_FORCE_COLOR: "0"
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections

jobs:
  ansible:
    name: ${{ inputs.playbook }}${{ inputs.check_mode && ' (check mode)' || '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install "ansible-core>=2.16,<2.20"
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Build inventory from Terraform state
        working-directory: terraform
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          cp backend_override.tf.example backend_override.tf
          printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > backend.hcl
          terraform init -input=false -backend-config=backend.hcl >/dev/null
          terraform output -json > "${RUNNER_TEMP}/tf-output.json"
          python3 ../scripts/render-inventory.py \
            --terraform-output "${RUNNER_TEMP}/tf-output.json" \
            --output ../ansible/inventories/production/hosts.yml

      - name: Write vault file from secret
        env:
          ANSIBLE_VAULT_YAML: ${{ secrets.ANSIBLE_VAULT_YAML }}
        run: |
          set -euo pipefail
          test -n "$ANSIBLE_VAULT_YAML" || { echo "::error::ANSIBLE_VAULT_YAML secret is missing"; exit 1; }
          install -m 0600 /dev/null ansible/inventories/production/group_vars/all/vault.yml
          printf '%s\n' "$ANSIBLE_VAULT_YAML" > ansible/inventories/production/group_vars/all/vault.yml

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is missing"; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          hosts="$(grep -E '^\s+ansible_host:' ansible/inventories/production/hosts.yml | awk '{print $2}')"
          # shellcheck disable=SC2086
          ssh-keyscan -T 10 -t ed25519 $hosts >> ~/.ssh/known_hosts 2>/dev/null
          for host in $hosts; do
            ssh-keygen -F "$host" -f ~/.ssh/known_hosts >/dev/null || { echo "::error::no host key for ${host}"; exit 1; }
          done

      - name: Run playbook
        working-directory: ansible
        run: |
          set -euo pipefail
          extra=()
          if [[ "${{ inputs.check_mode }}" == "true" ]]; then extra=(--check); fi
          ansible-playbook -i inventories/production "playbooks/${{ inputs.playbook }}.yml" --diff "${extra[@]}" | tee "${RUNNER_TEMP}/ansible.log"
          {
            echo '### Ansible ${{ inputs.playbook }}'
            echo '```text'
            tail -n 200 "${RUNNER_TEMP}/ansible.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up secrets
        if: always()
        run: rm -f ansible/inventories/production/group_vars/all/vault.yml ~/.ssh/id_ed25519 terraform/backend.hcl
